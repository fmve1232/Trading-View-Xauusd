# Deploys relay/ (the XAU/USD tick relay, display only) to Cloudflare Workers.
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages -> right-hand panel)
#   FINNHUB_KEY            free key from finnhub.io; uploaded as a Worker secret, never to the site
# After the first deploy, set the repository VARIABLE STREAM_URL to wss://<your worker host>/stream
# (the URL is printed in this run's summary) and the site starts streaming on its next run.
name: stream-relay

on:
  workflow_dispatch:
  push:
    branches: [main, master, claude/audit-prompt-real-artefacts-nekqv6]
    paths: ["relay/**", ".github/workflows/stream-relay.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the secrets are set (names only; values are never printed)
        id: cfg
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          S_FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          V_FINNHUB_KEY: ${{ vars.FINNHUB_KEY }}
        run: |
          ready=true
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FINNHUB_KEY; do
            s="S_$n"; v="V_$n"
            if [ -n "${!s}" ]; then msg="$n: found"
            elif [ -n "${!v}" ]; then ready=false; msg="$n: saved under Variables, not Secrets. Add it under Secrets -> New repository secret, then delete the variable."
            else ready=false; msg="$n: not visible to this workflow. Check the exact name, and that it is a Repository secret (not an Environment, Codespaces or Dependabot secret)."; fi
            echo "- $msg" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=secret check::$msg"   # names only, never values
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then echo "::warning::Not deployed: see the run summary for which secret is missing."; fi

      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          secrets: FINNHUB_KEY
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Report the stream URL
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          WSS="$(echo "$URL" | sed -E 's#^https://#wss://#; s#/*$##')/stream"
          {
            echo "### Relay deployed"
            echo ""
            echo "Health: \`$URL/health\`"
            echo ""
            echo "Set the repository **variable** \`STREAM_URL\` to: \`$WSS\`"
          } >> "$GITHUB_STEP_SUMMARY"
