# Deploys relay/ (the XAU/USD tick relay, display only) to Cloudflare Workers.
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages -> right-hand panel)
#   FINNHUB_KEY            free key from finnhub.io; uploaded as a Worker secret, never to the site
# After the first deploy, set the repository VARIABLE STREAM_URL to wss://<your worker host>/stream
# (the URL is printed in this run's summary) and the site starts streaming on its next run.
name: stream-relay

on:
  workflow_dispatch:
  push:
    branches: [main, master, claude/audit-prompt-real-artefacts-nekqv6]
    paths: ["relay/**", ".github/workflows/stream-relay.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the Cloudflare secrets are set
        id: cfg
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$K" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Relay not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FINNHUB_KEY secrets, then run this workflow." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          secrets: FINNHUB_KEY
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Report the stream URL
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          WSS="$(echo "$URL" | sed -E 's#^https://#wss://#; s#/*$##')/stream"
          {
            echo "### Relay deployed"
            echo ""
            echo "Health: \`$URL/health\`"
            echo ""
            echo "Set the repository **variable** \`STREAM_URL\` to: \`$WSS\`"
          } >> "$GITHUB_STEP_SUMMARY"
