# XAUUSD Quantum -- data -> engine -> GitHub Pages, every 15 minutes while gold trades.
#
# One-time setup (repository Settings):
#   Pages   -> Build and deployment -> Source: "GitHub Actions"
#   Actions -> General -> Workflow permissions: "Read and write"
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   TWELVEDATA_API_KEY   free key -> spot XAU/USD instead of Yahoo / COMEX futures
#   NTFY_TOPIC           ntfy.sh topic for phone alerts (no account needed)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL
# Optional variables: MT5_PRICE_OFFSET (alert prices), ALERT_TFS (default "15m,1h")
name: quantum-site

on:
  schedule:
    - cron: "*/15 * * * 0-5"      # UTC. Gold trades Sun 22:00 -> Fri 21:00 UTC; Saturday is skipped
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["quantum/**", "site/**", ".github/workflows/quantum-site.yml", "requirements.txt"]

permissions:
  contents: write     # push the market-data branch
  pages: write
  id-token: write

concurrency:
  group: quantum-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests (engine, no-look-ahead, execution model)
        run: python -m pytest -q tests

      - name: Load the market-data store
        run: |
          # A failed clone must STOP the run: carrying on with an empty store would force-push a
          # store without its history or forward ledger over the good one in the save step.
          URL="https://github.com/${{ github.repository }}.git"
          set +e; git ls-remote --exit-code --heads "$URL" market-data >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then git clone -q --depth 1 --branch market-data --single-branch "$URL" store
          elif [ $rc -eq 2 ]; then echo "market-data branch does not exist yet: starting a new store"; mkdir -p store
          else echo "::error::cannot reach the market-data branch (rc=$rc)"; exit 1; fi
          touch store-loaded.flag   # outside store/ and site/: never committed or published

      - name: Load the forward ledger (git history kept; restores the store's copy if it is missing)
        run: |
          URL="https://github.com/${{ github.repository }}.git"
          set +e; git ls-remote --exit-code --heads "$URL" forward-ledger >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then git clone -q --depth 1 --branch forward-ledger --single-branch "$URL" ledger
          elif [ $rc -eq 2 ]; then mkdir -p ledger && git -C ledger init -q -b forward-ledger
          else echo "::error::cannot reach the forward-ledger branch (rc=$rc)"; exit 1; fi
          if [ ! -f store/holdout_manifest.json ] && [ -f ledger/holdout_manifest.json ]; then
            echo "::warning::store had no holdout manifest: restored from forward-ledger"
            cp ledger/holdout_manifest.json store/ && mkdir -p store/holdout && cp -r ledger/holdout/. store/holdout/
          fi
          touch ledger-loaded.flag

      - name: Run pipeline
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MT5_PRICE_OFFSET: ${{ vars.MT5_PRICE_OFFSET }}
          ALERT_TFS: ${{ vars.ALERT_TFS || '15m,1h' }}
        run: python -m quantum.pipeline --store store --out site/data --tfs 15m,1h,4h,5m

      - name: Upcoming events (display only; outside the freeze key; never fails the run)
        continue-on-error: true
        run: python -m quantum.events --out site/data/events.json

      - name: Save the market-data store (one orphan commit; only changed month files are uploaded)
        if: always() && hashFiles('store-loaded.flag') != ''
        run: |
          cd store
          if [ ! -d .git ]; then git init -q -b market-data; fi
          git config user.name "quantum-pipeline"
          git config user.email "quantum-pipeline@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "market data $(date -u +%FT%TZ)" || exit 0
          # the shallow clone still knows the old tip, so unchanged blobs are not re-sent
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot:market-data

      - name: Save the forward ledger (normal commits, never force-pushed)
        if: always() && hashFiles('ledger-loaded.flag') != '' && hashFiles('store/holdout_manifest.json') != ''
        run: |
          cp store/holdout_manifest.json ledger/
          mkdir -p ledger/holdout && cp -r store/holdout/. ledger/holdout/ 2>/dev/null || true
          cd ledger
          git config user.name "quantum-pipeline"
          git config user.email "quantum-pipeline@users.noreply.github.com"
          git add -A
          git commit -q -m "forward ledger $(date -u +%FT%TZ)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:forward-ledger

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
