# XAUUSD Quantum -- data -> engine -> GitHub Pages, every 15 minutes while gold trades.
# Triggered by scheduler/ (Cloudflare Worker cron, free) with GitHub's own cron as the backup.
#
# One-time setup (repository Settings):
#   Pages   -> Build and deployment -> Source: "GitHub Actions"
#   Actions -> General -> Workflow permissions: "Read and write"
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   TWELVEDATA_API_KEY   free key -> spot XAU/USD instead of Yahoo / COMEX futures
#   NTFY_TOPIC           ntfy.sh topic for phone alerts (no account needed)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL
# Optional variables: MT5_PRICE_OFFSET (alert prices), ALERT_TFS (default "15m,1h")
#   PLAN_LATE_FRAC, MT5_SERVER_UTC_OFFSET, ALERT_LOCAL_TZ (alert timing; see quantum/notify.py)
#   ALERT_LIQUIDITY, LIQ_NEAR_USD (liquidity alerts; see quantum/notify.py)
name: quantum-site

on:
  schedule:
    # UTC. Two minutes after each 15-minute bar closes, so the provider has the finished bar
    # (at :00 the hourly bar was often not yet final, leaving the site a bar behind TradingView).
    # Gold trades Sun 22:00 -> Fri 21:00 UTC; Saturday is skipped. GitHub starts these late or not
    # at all (1-2 Oct: 100 of 153 runs, median gap 23 min), so they are the BACKUP: the primary
    # trigger is the free Cloudflare Worker cron in scheduler/, which dispatches this workflow.
    - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["quantum/**", "site/**", ".github/workflows/quantum-site.yml", "requirements.txt"]

permissions:
  contents: write     # push the market-data branch
  pages: write
  id-token: write
  actions: read       # the outage notice reads this workflow's recent runs (read only)

concurrency:
  group: quantum-site
  cancel-in-progress: false

jobs:
  gate:
    # A scheduled (backup) run stands down if a dispatched run started in the last 10 minutes, so
    # one 15-minute slot never spends Twelve Data's free 800 calls a day twice. Without the
    # scheduler there are no dispatched runs and every scheduled run proceeds, as before.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            last=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/quantum-site.yml/runs?event=workflow_dispatch&per_page=1" \
              | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or []; print(r[0]['created_at'] if r else '')" || true)
            if [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -lt 600 ]; then
                run=false
                echo "A dispatched run started ${age}s ago, so this scheduled backup run stands down." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests (engine, no-look-ahead, execution model)
        run: python -m pytest -q tests

      - name: Load the market-data store
        run: |
          # A failed clone must STOP the run: carrying on with an empty store would force-push a
          # store without its history or forward ledger over the good one in the save step.
          URL="https://github.com/${{ github.repository }}.git"
          set +e; git ls-remote --exit-code --heads "$URL" market-data >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then git clone -q --depth 1 --branch market-data --single-branch "$URL" store
          elif [ $rc -eq 2 ]; then echo "market-data branch does not exist yet: starting a new store"; mkdir -p store
          else echo "::error::cannot reach the market-data branch (rc=$rc)"; exit 1; fi
          touch store-loaded.flag   # outside store/ and site/: never committed or published

      - name: Load the forward ledger (git history kept; restores the store's copy if it is missing)
        run: |
          URL="https://github.com/${{ github.repository }}.git"
          set +e; git ls-remote --exit-code --heads "$URL" forward-ledger >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then git clone -q --depth 1 --branch forward-ledger --single-branch "$URL" ledger
          elif [ $rc -eq 2 ]; then mkdir -p ledger && git -C ledger init -q -b forward-ledger
          else echo "::error::cannot reach the forward-ledger branch (rc=$rc)"; exit 1; fi
          if [ ! -f store/holdout_manifest.json ] && [ -f ledger/holdout_manifest.json ]; then
            echo "::warning::store had no holdout manifest: restored from forward-ledger"
            cp ledger/holdout_manifest.json store/ && mkdir -p store/holdout && cp -r ledger/holdout/. store/holdout/
          fi
          if [ ! -d store/research_forward ] && [ -d ledger/research_forward ]; then
            echo "::warning::store had no research_forward record: restored from forward-ledger"
            cp -r ledger/research_forward store/
          fi
          touch ledger-loaded.flag

      - name: Run pipeline
        id: pipeline
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MT5_PRICE_OFFSET: ${{ vars.MT5_PRICE_OFFSET }}
          ALERT_TFS: ${{ vars.ALERT_TFS || '15m,1h' }}
          PLAN_LOT: ${{ vars.PLAN_LOT }}               # the operator's plan in each alert (defaults 0.5 lot, $650 / $650)
          PLAN_SL_USD: ${{ vars.PLAN_SL_USD }}
          PLAN_TP_USD: ${{ vars.PLAN_TP_USD }}
          PLAN_TP2_USD: ${{ vars.PLAN_TP2_USD }}         # two targets: the second half's TP in $ (default $20 of price; 0 = one TP)
          ALERT_SETUPS: ${{ vars.ALERT_SETUPS }}         # SETUP alerts from the operator's level rules (B16); 0 = off
          SETUP_LEVELS: ${{ vars.SETUP_LEVELS }}         # all (default) or major = previous day / week / month levels only
          ALERT_MODE: ${{ vars.ALERT_MODE }}             # quality (default): engine signals + setups with all 4 confirmations; all = every alert
          PLAN_COST_PER_LOT: ${{ vars.PLAN_COST_PER_LOT }}
          PLAN_LATE_FRAC: ${{ vars.PLAN_LATE_FRAC }}   # alert marked LATE when price moved this share of the stop (0.30)
          MT5_SERVER_UTC_OFFSET: ${{ vars.MT5_SERVER_UTC_OFFSET }}   # empty = New York + 7 h (UTC+2 winter / UTC+3 summer)
          ALERT_LOCAL_TZ: ${{ vars.ALERT_LOCAL_TZ }}   # local clock in alerts (Asia/Karachi)
          ALERT_LIQUIDITY: ${{ vars.ALERT_LIQUIDITY }}   # liquidity alerts (near / grab / break); 0 = off
          LIQ_NEAR_USD: ${{ vars.LIQ_NEAR_USD }}   # NEAR = price within this many $ of a pool (5)
          CONFIRM_PANEL: ${{ vars.CONFIRM_PANEL }}   # the website's two-stage confirmation panel + its event log; 0 = off (no code revert)
          FWD_B24: ${{ vars.FWD_B24 }}               # the B24-CONFIRM-FWD recorder (records only); ON ONLY when 1; unset = off
        run: python -m quantum.pipeline --store store --out site/data --tfs 15m,30m,1h,4h,5m

      - name: Upcoming events (display only; outside the freeze key; never fails the run)
        continue-on-error: true
        env:   # optional repository variables override the feed URLs without a code change
          MYFXBOOK_CAL_RSS: ${{ vars.MYFXBOOK_CAL_RSS }}
          MYFXBOOK_NEWS_RSS: ${{ vars.MYFXBOOK_NEWS_RSS }}
          FXSTREET_NEWS_RSS: ${{ vars.FXSTREET_NEWS_RSS }}
        run: python -m quantum.events --out site/data/events.json

      - name: Stream relay address for the page (display only; empty = no streaming)
        env:
          STREAM_URL: ${{ vars.STREAM_URL }}
        run: |
          python3 -c "import json,os; json.dump({'url': os.environ.get('STREAM_URL','').strip()}, open('site/data/stream.json','w'))"

      - name: Reference prices (OANDA practice + gold-api; display and validation only; never fails the run)
        continue-on-error: true
        env:   # OANDA_API_TOKEN: free practice-account token. Without it the panel says UNAVAILABLE.
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
          OANDA_ACCOUNT_ID: ${{ vars.OANDA_ACCOUNT_ID }}
        run: python -m quantum.reference --out site/data/reference.json --chart site/data/1h.json

      - name: Macro panel - DXY, EUR-USD, JPY-USD, US 10Y, WTI, BTC, real yield, breakeven, US 2Y vs gold (display only; never fails the run)
        continue-on-error: true
        run: python -m quantum.macro_panel --out site/data/macro_panel.json --chart site/data/15m.json

      - name: MT5 broker feed via MetaApi (display and validation only; never fails the run)
        continue-on-error: true
        env:   # free MetaApi account, connected with the MT5 INVESTOR (read-only) password
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          MT5_SYMBOL: ${{ vars.MT5_SYMBOL }}
        run: python -m quantum.mt5 --out site/data/mt5.json --store store --data site/data

      - name: Data-versioning manifest (bookkeeping only; before the store's orphan commit)
        if: always() && hashFiles('store-loaded.flag') != '' && hashFiles('ledger-loaded.flag') != ''
        continue-on-error: true
        run: python -m quantum.manifest --store store --ledger ledger

      - name: Save the market-data store (one orphan commit; only changed month files are uploaded)
        id: savestore
        if: always() && hashFiles('store-loaded.flag') != ''
        run: |
          cd store
          if [ ! -d .git ]; then git init -q -b market-data; fi
          git config user.name "quantum-pipeline"
          git config user.email "quantum-pipeline@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "market data $(date -u +%FT%TZ)" || exit 0
          # the shallow clone still knows the old tip, so unchanged blobs are not re-sent
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot:market-data

      - name: Save the forward ledger (normal commits, never force-pushed)
        if: always() && hashFiles('ledger-loaded.flag') != '' && hashFiles('store/holdout_manifest.json') != ''
        run: |
          cp store/holdout_manifest.json ledger/
          mkdir -p ledger/holdout && cp -r store/holdout/. ledger/holdout/ 2>/dev/null || true
          # registered alert-layer tests (B9-GRAB-FWD): the same git history as the engine's ledgers
          if [ -d store/research_forward ]; then mkdir -p ledger/research_forward && cp -r store/research_forward/. ledger/research_forward/; fi
          cd ledger
          git config user.name "quantum-pipeline"
          git config user.email "quantum-pipeline@users.noreply.github.com"
          git add -A
          git commit -q -m "forward ledger $(date -u +%FT%TZ)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:forward-ledger

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Outage notice (one phone message when alerts may be missing; never fails the run)
        # Added after the 2026-11-10 outage: 37 runs failed their test gate over 9 hours and nothing told the operator.
        # Sends ONE ntfy message on the first failed run (no other failed run of this workflow in the last 60 min), and only
        # when the alerts themselves may be affected: the pipeline (which sends them) did not succeed, or the store that
        # holds the alert state was not saved. A failed Pages deploy alone sends nothing: that run's alerts went out and the
        # next run republishes the site. OUTAGE_NOTICE=0 turns it off. The topic is a secret: masked, never printed.
        # format() is deliberate: an unset variable is null in an expression, and null != '0' is FALSE (null is coerced to
        # 0), so the first version (`vars.OUTAGE_NOTICE != '0'`) never ran while the variable was unset (runs 3038 and 3078
        # on 2026-11-11; probe run 43125115555).
        if: >-
          failure() && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PIPELINE: ${{ steps.pipeline.outcome }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "no NTFY_TOPIC: no notice"; exit 0; }
          prev=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/quantum-site.yml/runs?status=failure&per_page=20" \
            | python3 -c 'import datetime as d, json, os, sys; r = json.load(sys.stdin).get("workflow_runs") or []; now = d.datetime.now(d.timezone.utc); print(sum(1 for x in r if str(x["id"]) != os.environ["RUN_ID"] and (now - d.datetime.fromisoformat(x["created_at"].replace("Z", "+00:00"))).total_seconds() < 3600))' \
            || echo "?")
          echo "other failed runs in the last 60 min: $prev; pipeline: $PIPELINE"
          if [ "$prev" = "0" ]; then
            if [ "$PIPELINE" = "success" ]; then
              msg="XAUUSD ALERT STATE NOT SAVED: the site run of $(date -u +%H:%M) UTC sent its alerts but could not save their state. The next run may show them again (marked DELAYED or NOT ACTIONABLE). Do not open a second trade for the same signal."
            else
              msg="XAUUSD SITE DOWN: the site run of $(date -u +%H:%M) UTC failed, so alerts are paused until it is fixed. Signals from the gap will be marked NOT ACTIONABLE when it is back. Do not act on old alerts."
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Title: XAUUSD Quantum (site down)" --data-binary "$msg" "https://ntfy.sh/$NTFY_TOPIC")
            echo "ntfy.sh answered HTTP $code"
          fi
