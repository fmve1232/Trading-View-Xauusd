# TEMPORARY probe (removed in the next commit). Answers one question about the outage-notice step of
# quantum-site.yml: does `failure() && vars.X != '0'` run when the variable X is unset? No secrets, no writes.
# The job fails on purpose (step 1) so that failure() is true for the steps after it.
name: zz-probe-vars

on:
  push:
    branches: [claude/session-01fdjaothuvhxscxtl7ysa-y3n4w4]
    paths: [".github/workflows/zz-probe-vars.yml"]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: exit 1
      - if: failure()
        run: |
          echo "OUTAGE_NOTICE as JSON: ${{ toJSON(vars.OUTAGE_NOTICE) }}"
          echo "FWD_B24 as JSON: ${{ toJSON(vars.FWD_B24) }}"
          echo "ZZ_PROBE_SURELY_UNSET as JSON: ${{ toJSON(vars.ZZ_PROBE_SURELY_UNSET) }}"
      - if: failure() && vars.OUTAGE_NOTICE != '0'
        run: echo "A RAN (the deployed condition, OUTAGE_NOTICE)"
      - if: failure() && vars.ZZ_PROBE_SURELY_UNSET != '0'
        run: echo "B RAN (the deployed condition form, surely unset variable)"
      - if: failure() && format('x{0}', vars.ZZ_PROBE_SURELY_UNSET) != 'x0'
        run: echo "C RAN (proposed fix form, surely unset variable)"
      - if: failure() && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
        run: echo "D RAN (proposed fix form, OUTAGE_NOTICE)"
