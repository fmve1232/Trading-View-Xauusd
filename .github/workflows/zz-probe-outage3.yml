# TEMPORARY probe (removed in the next commit): GitHub's own evaluation of the outage-notice condition.
# No secrets, no writes, no network. Each matrix case reproduces one failure pattern of quantum-site.yml with the
# same step ids and step conditions; each "N-*" step is one candidate condition and only echoes when it runs.
name: zz-probe-outage3
on:
  push:
    branches: [claude/session-01fdjaothuvhxscxtl7ysa-y3n4w4]
    paths: [".github/workflows/zz-probe-outage3.yml"]
permissions:
  contents: read
jobs:
  p:
    strategy:
      fail-fast: false
      matrix:
        case: [ok, tests, loadstore, pipeline, savestore, ledger, events, upload, deploy, timeout]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.case == 'timeout' && 1 || 5 }}
    steps:
      - name: Unit tests
        run: '[ "${{ matrix.case }}" != tests ]'
      - name: Load the market-data store
        run: '[ "${{ matrix.case }}" != loadstore ] && touch store-loaded.flag'
      - name: Load the forward ledger
        run: touch ledger-loaded.flag && mkdir -p store && touch store/holdout_manifest.json
      - name: Run pipeline
        id: pipeline
        run: |
          if [ "${{ matrix.case }}" = timeout ]; then sleep 240; fi
          [ "${{ matrix.case }}" != pipeline ]
      - name: Upcoming events (continue-on-error, as in production)
        continue-on-error: true
        run: '[ "${{ matrix.case }}" != events ]'
      - name: Save the market-data store
        id: savestore
        if: always() && hashFiles('store-loaded.flag') != ''
        run: '[ "${{ matrix.case }}" != savestore ]'
      - name: Save the forward ledger
        if: always() && hashFiles('ledger-loaded.flag') != '' && hashFiles('store/holdout_manifest.json') != ''
        run: '[ "${{ matrix.case }}" != ledger ]'
      - name: upload-pages-artifact
        run: '[ "${{ matrix.case }}" != upload ]'
      - name: deploy-pages
        run: '[ "${{ matrix.case }}" != deploy ]'
      - name: N-REAL
        if: >-
          (failure() || cancelled()) && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        run: echo "p=${{ steps.pipeline.outcome }} s=${{ steps.savestore.outcome }}"
      - name: N-REAL-VAR0
        if: >-
          (failure() || cancelled()) && format('x{0}', '0') != 'x0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        run: echo ran
      - name: N-REAL-VAR1
        if: >-
          (failure() || cancelled()) && format('x{0}', '1') != 'x0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        run: echo ran
      - name: N-DEPLOYED
        if: failure() && vars.OUTAGE_NOTICE != '0'
        run: echo ran
      - name: N-PRA-FIRST
        if: >-
          failure() && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        run: echo ran
      - name: N-M1-NO-SAVESTORE
        if: >-
          (failure() || cancelled()) && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && steps.pipeline.outcome != 'success'
        run: echo ran
      - name: N-M2-AND
        if: >-
          (failure() || cancelled()) && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && (steps.pipeline.outcome != 'success' && steps.savestore.outcome != 'success')
        run: echo ran
      - name: N-M3-NO-OUTCOME
        if: (failure() || cancelled()) && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
        run: echo ran
      - name: N-M4-NULL-BUG
        if: >-
          (failure() || cancelled()) && vars.OUTAGE_NOTICE != '0'
          && (steps.pipeline.outcome != 'success' || steps.savestore.outcome != 'success')
        run: echo ran
      - name: N-M5-EQ
        if: >-
          (failure() || cancelled()) && format('x{0}', vars.OUTAGE_NOTICE) != 'x0'
          && (steps.pipeline.outcome == 'failure' || steps.savestore.outcome == 'failure')
        run: echo ran
