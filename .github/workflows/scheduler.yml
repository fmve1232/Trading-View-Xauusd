# Deploys scheduler/ (a Cloudflare Worker cron that dispatches quantum-site every 15 minutes).
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   as for relay/
#   GH_DISPATCH_TOKEN   fine-grained token, this repository only, "Actions: Read and write"
name: scheduler

on:
  workflow_dispatch:
  push:
    branches: [main, master, claude/audit-prompt-real-artefacts-nekqv6]
    paths: ["scheduler/**", ".github/workflows/scheduler.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the secrets are set (names only; values are never printed)
        id: cfg
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          S_GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          V_GH_DISPATCH_TOKEN: ${{ vars.GH_DISPATCH_TOKEN }}
        run: |
          ready=true
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GH_DISPATCH_TOKEN; do
            s="S_$n"; v="V_$n"
            if [ -n "${!s}" ]; then msg="$n: found"
            elif [ -n "${!v}" ]; then ready=false; msg="$n: saved under Variables, not Secrets. Add it under Secrets -> New repository secret, then delete the variable."
            else ready=false; msg="$n: not visible to this workflow. Check the exact name, and that it is a Repository secret (not an Environment, Codespaces or Dependabot secret)."; fi
            echo "- $msg" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=secret check::$msg"   # names only, never values
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then echo "::warning::Not deployed: see the run summary for which secret is missing."; fi

      - name: Deploy with wrangler 4 (deploy first, then store the secret on the existing Worker)
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        working-directory: scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # wrangler's own messages go to annotations so a failure is readable without the log;
          # it never prints the token values
          fail() { echo "::error title=$1::$(echo "$2" | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          out=$(npx --yes wrangler@4 deploy 2>&1) || fail "wrangler deploy" "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=deployed::$url"
          out=$(printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_DISPATCH_TOKEN 2>&1) || fail "wrangler secret put" "$out"
          echo "::notice title=secret stored::GH_DISPATCH_TOKEN stored as a Worker secret"

      - name: Report
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Scheduler deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: \`$URL/\`. quantum-site now starts at :01/:16/:31/:46 UTC while gold trades." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (token permission and cron registration; never prints a secret)
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 5
          chk=$(curl -fsS -m 30 "$URL/check" || echo '{"error":"check endpoint unreachable"}')
          echo "::notice title=token check::$chk"
          crons=$(curl -fsS -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xau-scheduler/schedules" \
            | python3 -c "import json,sys; j=json.load(sys.stdin); print(json.dumps([s.get('cron') for s in (j.get('result') or {}).get('schedules', [])]) if j.get('success') else 'error: ' + json.dumps(j.get('errors')))" || echo "unavailable")
          echo "::notice title=cron schedules::$crons"
          { echo "### Scheduler check"; echo ""; echo "- token: \`$chk\`"; echo "- crons: \`$crons\`"; } >> "$GITHUB_STEP_SUMMARY"
