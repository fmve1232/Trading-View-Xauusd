# Sends ONE test notification to the phone through the same channel the site's alerts use (repository secret
# NTFY_TOPIC, via ntfy.sh), so the setup can be checked without waiting for a signal. Manual dispatch only.
# The topic is a secret: GitHub masks it in the log, and it is never printed here.
name: alert-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a test alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLAN_LOT: ${{ vars.PLAN_LOT || '0.5' }}
          PLAN_SL_USD: ${{ vars.PLAN_SL_USD || '650' }}
          PLAN_TP_USD: ${{ vars.PLAN_TP_USD || '650' }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "::error::the repository secret NTFY_TOPIC is not set"; exit 1; fi
          if ! printf '%s' "$NTFY_TOPIC" | grep -Eq '^[A-Za-z0-9_-]{1,64}$'; then
            echo "::error::NTFY_TOPIC may contain only letters, digits, - and _ (no spaces, no https://ntfy.sh/ prefix)"; exit 1
          fi
          msg="TEST alert from XAUUSD Quantum: phone alerts work.
          Each signal will look like: XAUUSD 15m SELL (confirmed close) | entry ... SL ... TP1 ...
          YOUR PLAN ${PLAN_LOT} lot: SL (-\$${PLAN_SL_USD}) TP (+\$${PLAN_TP_USD}) | TP first ~50% | then one alert when TP or SL is hit."
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Title: XAUUSD Quantum (test)" --data-binary "$msg" "https://ntfy.sh/$NTFY_TOPIC")
          echo "ntfy.sh answered HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::ntfy.sh refused the message (HTTP $code)"; exit 1; fi
          { echo "### Test alert sent"; echo "ntfy.sh accepted it (HTTP 200). It should be on the phone within seconds,"; echo "in the ntfy app, under the topic saved as NTFY_TOPIC."; } >> "$GITHUB_STEP_SUMMARY"
