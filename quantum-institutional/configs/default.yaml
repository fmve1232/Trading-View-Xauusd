# Default runtime configuration. Secrets are NOT here -- they come from the
# environment (see .env.example and docs/SECURITY.md).

version: 1

execution:
  mode: PAPER          # overridden by EXECUTION_MODE; LIVE requires the exact word

instruments:
  primary: XAUUSD
  # Section 8: these are NOT interchangeable with XAUUSD spot and are recorded
  # as distinct instruments.
  context: [DXY, US10Y, EURUSD, XAGUSD, SPX, WTI, BTCUSD, GC]

timeframes:
  store: 1m            # highest reliable source resolution
  derive: [3m, 5m, 15m, 30m, 1H, 2H, 4H, 6H, 12H, 1D]
  # 1W is deliberately absent: it needs a session calendar, and the epoch anchor
  # would put the week boundary on a Thursday.

freshness_budget_seconds:
  market: 60
  macro: 86400
  news: 900

ingestion:
  chunk_days: 7
  checkpoint_every_chunks: 1
